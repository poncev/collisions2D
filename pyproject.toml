[build-system]
requires = ["scikit-build-core>=0.10", "setuptools>=68"]
build-backend = "scikit_build_core.build"

[project]
name = "multiscale-rasterization"
version = "0.1.0"
description = "2D multiscale rasterization of polylines (quadtree-based), C++ core with a Python wrapper"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
# matplotlib is a *soft* dependency: the core and the package import fine
# without it. Install this extra (`pip install -e '.[viz]'`) to enable the
# plotting helpers in multiscale_rasterization.visualization.
viz = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.version = ">=3.16"
cmake.args = ["-DMR_BUILD_TESTS=OFF"]
# The C++ core lives in the cpp/ directory; the Python package in python/.
cmake.source-dir = "cpp"
wheel.packages = ["python/multiscale_rasterization"]
# Build the extension module in place so it is importable from the package.
#
# The stable ABI target must match `requires-python` above: the package uses
# runtime PEP 585 generics (e.g. `tuple[float, float]` in _validation.py) and
# PEP 604 unions, so it cannot run on Python 3.8/3.9. Targeting `cp310` keeps
# the wheel tag consistent with the declared minimum interpreter.
wheel.py-api = "cp310"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
MR_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]