name: multiai
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - numpy
  - python-dotenv
  - ipykernel
  - cmake
  - ninja
  - pytest
  - pip
  - pip:
    - "pydantic-ai-slim[openai,openrouter]"
    - pypdf
    - pdfplumber
    - pytesseract
    - pdf2image
    - pypdfium2
    - pillow
    - reportlab
    - scikit-build-core
